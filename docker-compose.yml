services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: universal_chatbot_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    extra_hosts:
      # Memungkinkan container n8n menghubungi backend Laravel yang berjalan secara native di host
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Jakarta}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_CHANNEL=${SLACK_CHANNEL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - WHATSAPP_TARGET_NUMBER=${WHATSAPP_TARGET_NUMBER}
      - JIRA_ENABLED=${JIRA_ENABLED:-true}
      - JIRA_HOST=${JIRA_HOST:-imtekservice.atlassian.net}
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY:-SUP}
      - JIRA_USER_EMAIL=${JIRA_USER_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_ISSUE_TYPE=${JIRA_ISSUE_TYPE:-Service Request}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/backup/n8n:ro

volumes:
  n8n_data:
    driver: local
